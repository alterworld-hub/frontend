apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "frontend.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "frontend.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # preStop sleep (5s) + srvx graceful shutdown must fit.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "frontend.image" . }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_PATH_ID, value: {{ .Values.nodePath | quote }} }
            - { name: APP_VERSION, value: {{ .Chart.AppVersion | quote }} }
          lifecycle:
            # Keep serving while the ingress drops this endpoint; without it rollouts lose requests.
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
